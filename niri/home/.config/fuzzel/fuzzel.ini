# Warm Sage: shared desktop palette; see ~/.config/niri/README.md.
[main]
font=Adwaita Sans:size=12
dpi-aware=no
terminal=alacritty -e
icon-theme=Adwaita
prompt="Search  "
placeholder=Applications
width=42
lines=8
horizontal-pad=20
vertical-pad=14
inner-pad=12
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=352e29e6
text=e8dfd1ff
prompt=b7c99aff
placeholder=b2a496ff
input=e8dfd1ff
match=b7c99aff
selection=3f4938ff
selection-text=e8dfd1ff
selection-match=b7c99aff
counter=b2a496ff
border=b7c99aff

[border]
width=2
radius=12
