<text x="1338" y="226" text-anchor="end" fill="#b2a496" font-family="DejaVu Sans" font-size="14">PALETTE &amp; SYNTAX PREVIEW</text><text x="114" y="288" fill="#b2a496" text-anchor="end" font-family="DejaVu Sans Mono" font-size="17">1</text><text x="146" y="288" xml:space="preserve" font-family="DejaVu Sans Mono" font-size="22"><tspan fill="#b2a496">// A quiet palette, with room to think.</tspan></text><text x="114" y="319" fill="#b2a496" text-anchor="end" font-family="DejaVu Sans Mono" font-size="17">2</text><text x="146" y="319" xml:space="preserve" font-family="DejaVu Sans Mono" font-size="22"><tspan fill="#ceb2c1">interface </tspan><tspan fill="#91a7b0">Theme</tspan><tspan fill="#e8dfd1"> {</tspan></text><text x="114" y="350" fill="#b2a496" text-anchor="end" font-family="DejaVu Sans Mono" font-size="17">3</text><text x="146" y="350" xml:space="preserve" font-family="DejaVu Sans Mono" font-size="22"><tspan fill="#d8c8b8">  name</tspan><tspan fill="#b2a496">: </tspan><tspan fill="#91a7b0">string</tspan><tspan fill="#b2a496">;</tspan></text><text x="114" y="381" fill="#b2a496" text-anchor="end" font-family="DejaVu Sans Mono" font-size="17">4</text><text x="146" y="381" xml:space="preserve" font-family="DejaVu Sans Mono" font-size="22"><tspan fill="#d8c8b8">  colors</tspan><tspan fill="#b2a496">: </tspan><tspan fill="#ceb2c1">readonly </tspan><tspan fill="#91a7b0">string</tspan><tspan fill="#e8dfd1">[];</tspan></text><text x="114" y="412" fill="#b2a496" text-anchor="end" font-family="DejaVu Sans Mono" font-size="17">5</text><text x="146" y="412" xml:space="preserve" font-family="DejaVu Sans Mono" font-size="22"><tspan fill="#e8dfd1">}</tspan></text><text x="114" y="443" fill="#b2a496" text-anchor="end" font-family="DejaVu Sans Mono" font-size="17">6</text><text x="146" y="443" xml:space="preserve" font-family="DejaVu Sans Mono" font-size="22"></text><text x="114" y="474" fill="#b2a496" text-anchor="end" font-family="DejaVu Sans Mono" font-size="17">7</text><text x="